# Core environment: numpy and tqdm, plus the test and lint tooling. Dense and hybrid
# retrieval are NOT here on purpose - they need torch, and `pip install -e '.[dense]'`
# installs them along with the version caps that combination requires. See
# docs/decisions.md for why those caps exist.
name: groundwork
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - tqdm>=4.66
  - pytest>=8.0
  - ruff>=0.6
  - pip
  - pip:
      - snowballstemmer>=2.2
      - -e .
